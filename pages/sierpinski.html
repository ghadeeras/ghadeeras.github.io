<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
        <title>Sierpinski Triangles</title>
        <link type="text/css" rel="stylesheet" href="../index.css" />
        <script type="importmap">
            {
              "imports": {
                "lumen": "/node_modules/lumen/lib/index.js",
                "aether": "/node_modules/aether/lib/index.js",
                "gear": "/node_modules/gear/lib/index.js"
              }
            }
        </script>          
        <script type="module">
            import * as sierpinski from "../js/sierpinski/toy.js"
            import init from "../js/initializer.js"
            init(sierpinski);
        </script>
    </head>
    
    <body>
        <div class="menu">
            <div class="items">
                <div id="logo" title="Ghadeer's Playcloud"></div>
                <div id="controls-button" title="Controls"></div>
                <div id="monitor-button" title="Monitor"></div>
            </div>
            <div class="links">
                <div id="github" title="Fork me!"></div>
                <div id="linkedin" title="Contact me!"></div>
                <div id="mastodon" title="Follow me!"></div>
                <div id="youtube" title="Subscribe to my channel!"></div>
            </div>
        </div>
        <div class="tiles">
            <div>
                <canvas id="canvas-gl" width="960" height="960"></canvas>
                <div id="monitor" class="hud top-right">
                    <div>
                        <table>
                            <tr><th>Twist</th><td><span id="twist">0.0</span></span></td></tr>
                            <tr><th>Scale</th><td><span id="scale">1.0</span></span></td></tr>
                            <tr><th>Depth</th><td><span id="division-depth">5</span></td></tr>
                            <tr><th>FPS</th><td><span id="fps-watch">0</span></td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div id="controls" class="hud">
            <div>
                <h1>The Controls / Key Mappings</h1>
                <p>The following keys perform the folowing actions:</p>
                <table>
                    <tr><td></td><td><kbd id="control-t">T</kbd></td><td>Toggle twist control enablement</td></tr>
                    <tr><td></td><td><kbd id="control-s">S</kbd></td><td>Toggle scale control enablement</td></tr>
                    <tr><td></td><td><kbd id="control-corners">C</kbd></td><td>Show/hide corners</td></tr>
                    <tr><td></td><td><kbd class="control-centers">Shift</kbd> + <kbd class="control-centers">C</kbd></td><td>Show/hide centers</td></tr>
                    <tr><td></td><td><kbd id="control-inc-depth">&uparrow;</kbd></td><td>Increases division depth</td></tr>
                    <tr><td></td><td><kbd id="control-dec-depth">&downarrow;</kbd></td><td>Decrease division depth</td></tr>
                </table>
            </div>
        </div>
    </body>
</html>
